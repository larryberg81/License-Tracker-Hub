kind = "web"
previewPath = "/move-freight-fast/"
title = "Move Freight Fast"
description = "A modern shipping and logistics marketing website for Move Freight Fast, featuring five pages: Home (hero, stats, services, features), About (company story, mission, team stats), Services (detailed offerings), Contact (form with validation), and Track Shipment (demo tracking with seeded shipments and event timeline)."
version = "1.0.0"
id = "artifacts/move-freight-fast"
router = "path"

[[services]]
name = "web"
paths = [ "/move-freight-fast/" ]
localPort = 23670

[services.development]
run = "pnpm --filter @workspace/move-freight-fast run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/move-freight-fast", "run", "build" ]
serve = "static"
publicDir = "artifacts/move-freight-fast/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23670"
BASE_PATH = "/move-freight-fast/"
